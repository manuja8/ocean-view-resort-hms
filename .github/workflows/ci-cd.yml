name: CI/CD Workflow

on:
  push:
    branches:
      - development  # Trigger the workflow on push to the development branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest version of Ubuntu for the CI job

    steps:
      - name: Check out code
        uses: actions/checkout@v2  # Check out the repository code

      - name: Set up JDK 11
        uses: actions/setup-java@v2  # Set up Java version 11
        with:
          java-version: '11'

      - name: Build with Maven
        run: mvn clean install  # Run Maven build

      - name: Run tests
        run: mvn test  # Run tests with Maven